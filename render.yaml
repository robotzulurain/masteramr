services:
  - type: web
    name: masteramr-backend
    env: python
    plan: free
    repo: robotzulurain/masteramr
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: ./startup.sh && gunicorn r_app.wsgi --log-file -
    envVars:
      - key: DATABASE_URL
        sync: true
      - key: SECRET_KEY
        generate: true
      - key: ALLOWED_HOSTS
        value: "*"
